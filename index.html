<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-image"></div>

    <div class="app">
        <header class="hero">
            <img class="logo" src="/sources/logo.png" alt="logo">
        </header>

        <section class="map-card">
            <iframe class="map-frame"
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2813.1695725057693!2d-49.96513909666605!3d-22.232993210606846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-PT!2sbr!4v1777989815208!5m2!1spt-PT!2sbr"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>

            <iframe class="map-frame pulse pulse-center"
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2813.1695725057693!2d-49.96513909666605!3d-22.232993210606846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-PT!2sbr!4v1777989815208!5m2!1spt-PT!2sbr"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>



            <div class="pulse-center"></div>
        </section>

        <div class="btnflex">
            <button id="startBtn">Explorar</button>
        </div>


        <nav class="bottom-nav">
            <button>Home</button>
            <button>Mapa</button>
            <button>Perfil</button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>

</html>
